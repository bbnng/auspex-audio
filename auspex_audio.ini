[General]
; Master enable for the Steam Audio + miniaudio sound engine (1 = enabled, 0 = vanilla DirectSound).
; In-game: sa_enable 0 / 1
enabled=1

; Master output volume multiplier (0.0 to 2.0, default 1.0). In-game: sa_volume 1.0
master_volume=1

; Fade to silence while another window is in front, as the original game does (1 = on, 0 = keep playing).
; In-game: sa_mute_background 0 / 1
mute_in_background=1

[Spatial]
; Steam Audio HRTF binaural 3D sound, for headphones (1 = on, 0 = stereo, for loudspeakers). In-game: sa_hrtf 0 / 1
hrtf=1

; Your own HRTF as a .sofa file (empty = the built-in HRTF). Put the file into this mod's folder, or into a folder
; "sofa" in it, and write its name here; a full path works too. In-game: sa_sofa
sofa_file=

; Walls muffle sounds behind them, raytraced and by material (1 = on, 0 = off). In-game: sa_occlusion 0 / 1
occlusion=1

; Number of occlusion rays per sound (4 to 64, default 16).
occlusion_samples=16

; Doors, elevators, breakable walls and other moving brushes block sound while they are closed and let it through
; when they open (1 = on, 0 = only the map itself). In-game: sa_doors 0 / 1
dynamic_doors=1

; Characters sound a little softer and duller when they face away from you (1 = on, 0 = off). Lines of a
; conversation with you are never affected. In-game: sa_directivity 0 / 1
voice_directivity=1

; The protective glass of counters (pawn shop, blood bank) muffles the voice behind it, also in conversations
; (1 = on, 0 = off). In-game: sa_tweaks dialogue_glass 0 / 1
dialogue_glass=1

; Raytraced reflections and reverb of the room you are in (1 = on, 0 = off). In-game: sa_reverb 0 / 1
reverb=1

; hybrid = the first reflections come from the walls they bounce off (convolution), the rest is a smooth tail.
; parametric = smooth tail only, a little cheaper. If hybrid cannot be set up, parametric is used by itself.
; In-game: sa_reverb_mode hybrid / parametric
reverb_mode=hybrid

; Hybrid reverb only: how many seconds are rendered as single reflections (0.1 to 0.6, default 0.3). Longer costs
; more CPU.
early_reflections=0.3

; Loudness of the reverb (0.0 to 2.0, default 0.55). In-game: sa_reverb 1 0.55
reverb_wet=0.55

; Max reflection rays per simulation step (256 to 4096, default 1024).
reflection_rays=1024

; Max reflection bounces (1 to 8, default 4).
reflection_bounces=4

; Longest simulated reverb in seconds (0.5 to 3.0, default 1.25).
reverb_duration=1.25

[Weather]
; Rain and thunder that play everywhere become quieter and duller under a roof (1 = on, 0 = equally loud
; everywhere). In-game: sa_weather 0 / 1
weather_occlusion=1

; Loudness of that rain outdoors, compared to the original game (0.0 to 2.0, default 0.65).
; In-game: sa_weather_vol 0.65
weather_volume=0.65

; How much rain covers what is far away while you stand in it: distant voices and steps get softer and duller,
; traffic and other sounds of the city step back (0.0 = not at all, default 1.0, up to 2.0). Near voices and
; conversations stay clear. In-game: sa_rain 1.0
rain_masking=1

[Tweaks]
; Lines of passers-by that the game plays equally in both ears come from the person who says them (1 = on, 0 = off).
; All of [Tweaks] in-game: sa_tweaks
fix_npc_barks=1

; Everybody speaks at one loudness: passers-by and people in conversations who were recorded too loud are turned
; down, those who are too quiet are turned up. Works with any voice file, also of mods. Whispers stay soft, screams
; stay loud (1 = on, 0 = the recordings as they are).
level_voices=1

; Frenzy, and bass that stacks up (combat music, disciplines), stay below the level where they hurt
; (1 = on, 0 = off).
tame_loud_sounds=1

; Outdoors, random street sounds (steps, cars, sirens) come from the street instead of out of the walls of houses
; (1 = on, 0 = off).
fix_ambient_directions=1

; Leaves out the heels and steps of people who are not there: background sounds of streets, cafes and clubs
; (Pedestrianby1, 2, 3, 5 and Ambient_High_Heels). Steps of the player and of characters always stay
; (1 = leave out, 0 = play them).
filter_heels_ambients=1

; Leaves out the trotting background steps that sound like the hoofs of a horse (Pedestrianby4)
; (1 = leave out, 0 = play them).
filter_hoof_ambient=1

[Output]
; 0 = the rate of your sound device (best: no conversion by Windows, lowest delay). 44100 or 48000 force that rate.
sample_rate=0
